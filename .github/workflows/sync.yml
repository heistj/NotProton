name: sync-upstream

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  workflows: write

jobs:
  sync:
    name: merge upstream/main
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.merge.outputs.synced }}
      version: ${{ steps.merge.outputs.version }}
      release_notes: ${{ steps.merge.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch and merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/NotProtonNot/NotProton.git || true
          git fetch upstream main
          git fetch --tags origin

          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $BEHIND_COUNT"

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Already up to date with upstream."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_HEAD=$(git rev-parse HEAD)

          echo "Merging upstream/main into main..."
          if git merge --no-edit upstream/main; then
            echo "Merge succeeded cleanly. Pushing to origin..."
            git push origin main
          else
            echo "Merge conflict detected!" >&2
            git merge --abort
            exit 1
          fi

          NEXT_VERSION=$(python3 -c 'import pathlib, re, subprocess; text = pathlib.Path("dylib/version.h").read_text(); m = re.search(r"#define NOTPROTON_VERSION \"(.*)\"", text); base = m.group(1) if m else "1.1.6"; tags = subprocess.check_output(["git", "tag", "-l"], text=True).splitlines(); p = f"v{base}."; nums = [int(t[len(p):]) for t in tags if t.startswith(p) and t[len(p):].isdigit()]; print(f"{base}.{max(nums)+1 if nums else 1}")')
          echo "Next release version: $NEXT_VERSION"

          UPSTREAM_COMMITS=$(git log --format="- %s (%h)" "$OLD_HEAD..upstream/main")
          RELEASE_NOTES=$(printf "Automated release following upstream sync (%s):\n\nMerged upstream commits:\n%s" "$NEXT_VERSION" "$UPSTREAM_COMMITS")

          {
            echo "synced=true"
            echo "version=$NEXT_VERSION"
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify on conflict
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ Upstream sync merge conflict" \
            --assignee "heistj" \
            --body "Hi @heistj (heisterbergjon@gmail.com),

            An automated attempt to merge \`NotProtonNot/NotProton:main\` into \`main\` encountered conflicts.

            - **Repository**: ${{ github.repository }}
            - **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Recipient**: heisterbergjon@gmail.com

            Please resolve the merge conflict manually in your local copy:
            \`\`\`bash
            git switch main
            git fetch upstream
            git merge upstream/main
            # resolve conflicting files
            git commit
            git push origin main
            \`\`\`" \
            || true

  release:
    name: publish release
    needs: sync
    if: needs.sync.outputs.synced == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      release_notes: ${{ needs.sync.outputs.release_notes }}
    secrets: inherit
